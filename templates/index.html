<!DOCTYPE html>
<html>
<head>
    <title>To-Do List</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="container">
    <h1>To-Do List 📋</h1>

    <div class="input-box">
        <input type="text" id="taskInput" placeholder="Add your task">
        <button onclick="addTask()">ADD</button>
    </div>

    <div class="counter">
        <span id="total">Total: 0</span>
        <span id="completed">Completed: 0</span>
        <span id="remaining">Remaining: 0</span>
    </div>

    <button class="clear-btn" onclick="clearCompleted()">Clear Completed</button>

    <div class="filters">
        <button onclick="setFilter('all')" class="active" id="filter-all">All</button>
        <button onclick="setFilter('completed')" id="filter-completed">Completed</button>
        <button onclick="setFilter('pending')" id="filter-pending">Pending</button>
    </div>

    <ul id="taskList"></ul>
</div>

<script src="/static/index.js"></script>
</body>
</html>
